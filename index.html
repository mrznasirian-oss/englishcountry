<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --accent2: #22d3ee;
  --border: #334155;
  --success: #34d399;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tahoma', 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
header {
  text-align: center;
  padding: 2rem 1rem;
  margin-bottom: 1.5rem;
}
header h1 {
  font-size: 1.8rem;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 0.5rem;
}
header p { color: var(--muted); font-size: 0.95rem; }
.search-box {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(10px);
  padding: 1rem 0;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.search-box input {
  width: 100%;
  padding: 0.9rem 1.2rem;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1.05rem;
  outline: none;
  transition: border-color 0.2s;
  direction: rtl;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--muted); }
.stats {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 1.5rem;
  color: var(--muted);
  font-size: 0.9rem;
}
.stats span { background: var(--card); padding: 0.4rem 0.9rem; border-radius: 20px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1.2rem;
}
.card {
  background: var(--card);
  border-radius: 16px;
  padding: 1.25rem;
  border: 1px solid var(--border);
  transition: transform 0.2s, box-shadow 0.2s;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(56, 189, 248, 0.15);
  border-color: var(--accent);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.flag { font-size: 2.8rem; line-height: 1; }
.names h2 { font-size: 1.15rem; margin-bottom: 0.15rem; }
.names .en { color: var(--muted); font-size: 0.9rem; direction: ltr; text-align: right; }
.info-row {
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  font-size: 0.88rem;
  padding: 0.25rem 0;
  border-bottom: 1px dashed var(--border);
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--muted); white-space: nowrap; }
.info-value { text-align: left; direction: ltr; flex: 1; }
.info-value.fa { direction: rtl; text-align: right; }
.hidden { display: none !important; }
.no-results {
  text-align: center;
  padding: 3rem;
  color: var(--muted);
  grid-column: 1 / -1;
}
footer {
  text-align: center;
  padding: 2rem;
  color: var(--muted);
  font-size: 0.85rem;
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  header h1 { font-size: 1.4rem; }
}
</style>
</head>

<div class="container">

    <p>نام کشورها، پایتخت، قاره، زبان، ملیت و پرچم — فارسی و انگلیسی<br>کاملاً آفلاین | Offline & Searchable</p>
  </header>

  <div class="search-box">

  <div class="stats">

  <div class="no-results hidden" id="no-results">نتیجه‌ای یافت نشد 😕</div>

    ساخته شده برای استفاده آفلاین • تمام داده‌ها داخل فایل جاسازی شده‌اند

</div>

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const countEl = document.getElementById('count');
const noResults = document.getElementById('no-results');

function render(list) {
  grid.innerHTML = '';
  if (list.length === 0) {
    noResults.classList.remove('hidden');
    countEl.textContent = '۰ کشور';
    return;
  }
  noResults.classList.add('hidden');
  countEl.textContent = list.length.toLocaleString('fa-IR') + ' کشور';
  
  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-header">
        <span class="flag">${c.emoji || '🏳️'}</span>
        <div class="names">
          <h2>${c.name_fa}</h2>
          <div class="en">${c.name_en}</div>
        </div>
      </div>
      <div class="info-row">
        <span class="info-label">پایتخت / Capital</span>
        <span class="info-value fa">${c.capital_fa} <span style="color:var(--muted);font-size:0.85em">(${c.capital_en})</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">قاره / Continent</span>
        <span class="info-value fa">${c.continent_fa} <span style="color:var(--muted);font-size:0.85em">(${c.continent_en})</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">زبان / Language</span>
        <span class="info-value fa">${c.languages_fa} <span style="color:var(--muted);font-size:0.85em">(${c.languages_en})</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">ملیت / Nationality</span>
        <span class="info-value fa">${c.nationality_fa} <span style="color:var(--muted);font-size:0.85em">(${c.nationality_en})</span></span>
      </div>
      <div class="info-row">
        <span class="info-label">کد / Code</span>
        <span class="info-value">${c.code} • +${c.phone} • ${c.currency}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filter() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) {
    render(countries);
    return;
  }
  const filtered = countries.filter(c => {
    const fields = [
      c.name_fa, c.name_en, c.capital_fa, c.capital_en,
      c.continent_fa, c.continent_en, c.languages_fa, c.languages_en,
      c.nationality_fa, c.nationality_en, c.code, c.native, c.currency
    ].join(' ').toLowerCase();
    return fields.includes(q);
  });
  render(filtered);
}

searchInput.addEventListener('input', filter);
render(countries);
</script>
